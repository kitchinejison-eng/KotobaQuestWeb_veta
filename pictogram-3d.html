<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#8bd3f0">
<title>ピクトグラム ○× 3Dクイズ｜ことクエ モバイル版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bd3f0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none}
#view{position:fixed;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 4px #123}
.top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.pill{background:#142b40df;border:1px solid #ffffff66;border-radius:12px;padding:8px 12px;font-size:clamp(12px,1.6vw,16px);font-weight:900}
.pill span{color:#ffe17c}
#qbox{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(720px,92vw);padding:11px 15px;border-radius:15px;text-align:center;background:#142b40e8;border:1px solid #ffffff70}
#qbox small{display:block;font-size:11px;letter-spacing:.12em;color:#bfeaff}
#question{font-size:clamp(18px,2.8vw,26px);font-weight:950;margin:5px 0}
#hint{font-size:12px;color:#d8efff}
#help{position:absolute;bottom:12px;left:12px;background:#142b40dc;border-radius:11px;padding:9px 12px;font-size:12px;line-height:1.6}
#mobileHelp{display:none}
#touch{display:none;position:absolute;right:14px;bottom:14px;width:145px;height:145px;pointer-events:none}
#base{position:absolute;left:0;bottom:0;width:116px;height:116px;border:2px solid #ffffff99;background:#142b4077;border-radius:50%;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:33px;top:33px;width:46px;height:46px;border-radius:50%;border:3px solid #35536b;background:#e8f7ffed;pointer-events:none}
#jump{position:absolute;right:0;bottom:12px;width:62px;height:62px;border:2px solid white;border-radius:50%;background:#ffbd43;color:#3a290d;font-weight:1000;pointer-events:auto}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:#09182dbb}
.panel{width:min(520px,100%);padding:27px 22px;border-radius:22px;text-align:center;color:white;background:linear-gradient(155deg,#24445d,#10243a);border:1px solid #ffffff77;box-shadow:0 20px 70px #0008}
.panel h1{font-size:clamp(29px,7vw,44px);line-height:1.2;margin:0 0 12px}.panel p{line-height:1.75;color:#e4f2fc}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.action{border:0;border-radius:13px;padding:15px 28px;min-width:210px;background:linear-gradient(#ffe779,#ffb537);color:#3a280b;font-weight:1000;font-size:19px;box-shadow:0 5px 0 #a66b1c}
.action:active{transform:translateY(3px);box-shadow:0 2px 0 #a66b1c}
.hidden{display:none!important}
#status{font-size:12px;color:#c2e1f6;min-height:18px;margin-top:12px}
#toast{position:fixed;z-index:8;top:48%;left:50%;transform:translate(-50%,-50%);padding:14px 24px;border-radius:15px;background:#142b40ef;border:2px solid white;font-size:clamp(24px,5vw,34px);font-weight:1000;opacity:0;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media(max-width:760px){#help{display:none}#mobileHelp{display:block;position:absolute;left:8px;bottom:12px;background:#142b40dc;border-radius:10px;padding:8px;font-size:10px;line-height:1.5}#touch{display:block}.top{left:6px;right:6px;gap:4px}.pill{font-size:11px;padding:7px 8px}#qbox{top:54px;width:94vw;padding:8px 10px}}
@media(orientation:landscape) and (max-height:500px){#qbox{top:45px;width:58vw;padding:6px}#qbox small,#hint{display:none}#question{font-size:17px}.top{top:4px}#touch{transform:scale(.78);transform-origin:bottom right;bottom:4px}}

/* V84 mobile viewport fit: preserve HUD, question, touch pad and safe areas. */
:root{--p3-safe-top:env(safe-area-inset-top,0px);--p3-safe-right:env(safe-area-inset-right,0px);--p3-safe-bottom:env(safe-area-inset-bottom,0px);--p3-safe-left:env(safe-area-inset-left,0px)}
.top{top:calc(7px + var(--p3-safe-top));left:calc(8px + var(--p3-safe-left));right:calc(8px + var(--p3-safe-right));}
#qbox{top:calc(62px + var(--p3-safe-top));max-height:calc(100vh - 82px - var(--p3-safe-top));overflow:auto;overscroll-behavior:contain}
#help{left:calc(10px + var(--p3-safe-left));bottom:calc(10px + var(--p3-safe-bottom));}
#mobileHelp{left:calc(8px + var(--p3-safe-left));bottom:calc(8px + var(--p3-safe-bottom));}
#touch{right:calc(14px + var(--p3-safe-right));bottom:calc(14px + var(--p3-safe-bottom));}
.overlay{padding:calc(12px + var(--p3-safe-top)) calc(10px + var(--p3-safe-right)) calc(12px + var(--p3-safe-bottom)) calc(10px + var(--p3-safe-left));overflow:hidden}
.panel{max-height:100%;overflow:auto;overscroll-behavior:contain}
@media(orientation:portrait){#qbox{width:min(94vw,620px);top:calc(55px + var(--p3-safe-top));padding:8px 10px}#question{font-size:clamp(17px,4.8vw,24px)}#touch{width:136px;height:136px}#base{width:108px;height:108px}#knob{left:31px;top:31px}}
@media(orientation:landscape){#qbox{width:min(60vw,680px);top:calc(54px + var(--p3-safe-top));padding:7px 10px}#question{font-size:clamp(15px,2.8vw,22px)}#touch{transform:scale(.82);transform-origin:bottom right}}
@media(orientation:landscape) and (max-height:420px){#qbox{top:calc(43px + var(--p3-safe-top));width:min(54vw,620px);padding:4px 8px}#qbox small,#hint{display:none}#question{font-size:15px}.top{top:calc(3px + var(--p3-safe-top))}.pill{padding:4px 7px;font-size:10px}#touch{transform:scale(.68);transform-origin:bottom right}}
</style>
</head>
<body>
<div id="view"></div>
<div id="hud">
 <div class="top"><div class="pill">問題 <span id="qnum">0 / 4</span></div><div class="pill">スコア <span id="score">0</span></div><div class="pill">PICTOGRAM 3D</div></div>
 <div id="qbox"><small>PICTOGRAM WORLD · ○× QUIZ</small><div id="question">3Dワールドを準備中…</div><div id="hint">正しいと思うエリアへ歩いていこう！</div></div>
 <div id="help">移動：W A S D ／ 矢印キー<br>視点：マウスドラッグ ／ ジャンプ：Space</div>
 <div id="mobileHelp">左スティック：移動<br>画面スワイプ：視点変更</div>
 <div id="touch"><div id="base"><div id="knob"></div></div><button id="jump" type="button">JUMP</button></div>
</div>
<div class="overlay" id="start"><div class="panel"><h1>🟢 ピクトグラム<br>○× 3Dクイズ</h1><p>シンプルな3D空間を自由に移動！<br>○と×のエリアに進んで全4問に挑戦しよう。</p><p>PC：WASDで移動・マウスドラッグで視点変更<br>スマホ：スティックで移動・画面スワイプで視点変更</p><button class="action" id="startBtn" type="button">ゲームスタート</button><div id="status">3Dエンジンを読み込み中…</div></div></div>
<div class="overlay hidden" id="result"><div class="panel"><h1>クイズ終了！</h1><h1 id="finalScore">0 / 4</h1><p id="resultText"></p><p id="medalReward" class="hidden" style="font-size:22px;color:#ffe17c;font-weight:900">🏅 メダル +1</p><button class="action" id="retry" type="button">もう一度プレイ</button><br><button id="backToGenres" type="button" style="margin-top:14px;border:1px solid #ffffff77;border-radius:12px;padding:11px 20px;background:#18364a;color:#fff;font-weight:800">ジャンル選択へ戻る</button></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let engineReady=false,loadFailed=false,startRequested=false;
$('startBtn').addEventListener('click',()=>{if(window.startQuiz)window.startQuiz();else{startRequested=true;$('status').textContent=loadFailed?'3Dエンジンを読み込めません。インターネット接続を確認して再読み込みしてください。':'3Dワールドを準備中…';}});
$('retry').addEventListener('click',()=>window.startQuiz&&window.startQuiz());
$('backToGenres').addEventListener('click',()=>{window.location.href='index.html?v=84m2#home';});
</script>
<script type="module">
(async()=>{
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
const root=$('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd3f0);scene.fog=new THREE.Fog(0x8bd3f0,42,100);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f8ff,0x687b74,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-15,28,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c,rough=0.8)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const floorMat=mat(0xe7edf0),lineMat=mat(0xc8d5da),green=mat(0x00a85a,.65),white=mat(0xffffff,.55),red=mat(0xf0525d,.55),dark=mat(0x233445),skin=mat(0x00a85a,.7),accent=mat(0x69d9a2,.6);
function addBox(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;o.castShadow=true;scene.add(o);return o}
addBox(80,1,85,floorMat,0,-.6,0);
for(let x=-38;x<=38;x+=4)addBox(.025,.015,80,lineMat,x,.01,0);
for(let z=-40;z<=40;z+=4)addBox(76,.015,.025,lineMat,0,.012,z);
// Smooth abstract scenery: curved arches, spheres, pillars and low circular landscaping.
function cylinder(r1,r2,h,m,x,y,z,segments=32){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function ring(x,z,color){const m=mat(color,.5);const torus=new THREE.Mesh(new THREE.TorusGeometry(3.2,.32,16,64),m);torus.position.set(x,3.5,z);torus.castShadow=true;scene.add(torus);cylinder(4.5,4.5,.3,white,x,.2,z);cylinder(4.1,4.1,.15,m,x,.4,z)}
// abstract smooth forms around arena
for(const p of [[-25,-14],[25,-18],[-27,17],[27,16]]){cylinder(1.3,2.2,5,mat(0xb8d2dc),p[0],2.5,p[1]);const s=new THREE.Mesh(new THREE.SphereGeometry(2.1,24,16),mat(0xd3e7ed));s.position.set(p[0],5.7,p[1]);s.castShadow=true;scene.add(s)}
// Answer zones with large clean circular marks and readable floating labels.
const answerZones=[{x:-9,z:-18,value:true},{x:9,z:-18,value:false}];
function labelTexture(symbol,label,color){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');g.fillStyle='#18364a';g.fillRect(0,0,512,256);g.strokeStyle=color;g.lineWidth=12;g.strokeRect(8,8,496,240);g.fillStyle='#fff';g.textAlign='center';g.font='bold 115px sans-serif';g.fillText(symbol,256,130);g.font='bold 38px sans-serif';g.fillText(label,256,207);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
for(const a of answerZones){const color=a.value?0x21b985:0xee5262;const base=mat(color,.55);cylinder(4.8,4.8,.35,mat(0x536773),a.x,.15,a.z);cylinder(4.55,4.55,.16,base,a.x,.4,a.z);
if(a.value){const t=new THREE.Mesh(new THREE.TorusGeometry(1.7,.3,18,64),white);t.rotation.x=Math.PI/2;t.position.set(a.x,.55,a.z);t.castShadow=true;scene.add(t)}else{for(const ang of [-Math.PI/4,Math.PI/4]){const b=new THREE.Mesh(new THREE.BoxGeometry(3.9,.28,.48),white);b.position.set(a.x,.58,a.z);b.rotation.y=ang;b.castShadow=true;scene.add(b)}}
const signMat=new THREE.MeshBasicMaterial({map:labelTexture(a.value?'○':'×',a.value?'ただしい':'まちがい',a.value?'#42e7a9':'#ff7a86'),side:THREE.DoubleSide});const sign=new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.2),signMat);sign.position.set(a.x,5.0,a.z-2.5);scene.add(sign);cylinder(.12,.12,2.8,mat(0x708995),a.x,1.8,a.z-2.5,12)}
// Pictogram human: round head, simple capsule-like torso, cylindrical limbs, no face/clothes.
const player=new THREE.Group();scene.add(player);const person=new THREE.Group();player.add(person);
function sphere(parent,r,m,x,y,z,scaleY=1){const o=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);o.position.set(x,y,z);o.scale.y=scaleY;o.castShadow=true;parent.add(o);return o}
sphere(person,.34,green,0,2.45,0);
sphere(person,.38,green,0,1.72,0,1.35);
const arms=[],legs=[];
function limb(parent,r,len,m,x,y,z){const pivot=new THREE.Group();pivot.position.set(x,y,z);parent.add(pivot);const o=new THREE.Mesh(new THREE.CapsuleGeometry(r,len-r*2,5,12),m);o.position.y=-len/2;o.castShadow=true;pivot.add(o);return pivot}
arms.push(limb(person,.13,.88,green,-.46,2.0,0),limb(person,.13,.88,green,.46,2.0,0));legs.push(limb(person,.15,.92,green,-.2,1.1,0),limb(person,.15,.92,green,.2,1.1,0));
player.position.set(0,0,17);
let yaw=0,pitch=.13,drag=false,lastX=0,lastY=0;
const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.002,-.3,.7)});
function stopDrag(){drag=false}canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);canvas.addEventListener('lostpointercapture',stopDrag);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&playing)jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
let sx=0,sy=0,pid=null;const base=$('base'),knob=$('knob');base.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{base.setPointerCapture(pid)}catch(_){};stick(e)});base.addEventListener('pointermove',e=>{if(e.pointerId===pid)stick(e)});function stick(e){const r=base.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),n=Math.hypot(dx,dy),max=38;if(n>max){dx=dx/n*max;dy=dy/n*max}sx=dx/max;sy=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}function endStick(e){if(e.pointerId!==pid)return;pid=null;sx=sy=0;knob.style.transform='translate(0,0)'}base.addEventListener('pointerup',endStick);base.addEventListener('pointercancel',endStick);base.addEventListener('lostpointercapture',endStick);
let playing=false,locked=false,ground=true,vy=0,jumpQueued=false,idx=0,score=0,toastTimer=0,medalAwarded=false;
const qs=[['太陽は東から昇る。',true],['タコの足は6本である。',false],['日本の首都は東京である。',true],['月は太陽の光を反射して光る。',true],['1週間は8日間である。',false],['イルカは魚の仲間である。',false],['1メートルは100センチメートルである。',true],['ペンギンは空を飛べる。',false]];
let deck=[];
function hud(){ $('qnum').textContent=(idx+1)+' / 4';$('score').textContent=score;$('question').textContent=deck[idx][0];$('hint').textContent='○か×のエリアに入ると回答できます';}
function startGame(){deck=qs.slice().sort(()=>Math.random()-.5).slice(0,4);idx=score=0;medalAwarded=false;playing=true;locked=false;yaw=0;pitch=.13;player.position.set(0,0,17);$('start').classList.add('hidden');$('result').classList.add('hidden');$('medalReward').classList.add('hidden');hud()}
window.startQuiz=startGame;
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1000)}
function awardMedal(){if(medalAwarded)return false;medalAwarded=true;try{const key='kotobaDungeonSaveV1';let d={};try{d=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(_){}d.medals=Math.max(0,Math.floor(Number(d.medals)||0))+1;if(!Array.isArray(d.unlockedAvatarIds))d.unlockedAvatarIds=[1,2,3,4];if(!Array.isArray(d.unlockedOutfitIds))d.unlockedOutfitIds=[];if(!Array.isArray(d.history))d.history=[];localStorage.setItem(key,JSON.stringify(d));return true}catch(e){console.warn('メダルを保存できませんでした',e);return false}}
function finish(){playing=false;locked=true;$('finalScore').textContent=score+' / 4';$('resultText').textContent=score===4?'パーフェクト！':score>=2?'よくできました！':'ナイスチャレンジ！もう一度挑戦してみよう。';const earned=awardMedal();$('medalReward').classList.toggle('hidden',!earned);if(earned)$('resultText').textContent+=' 最後まで挑戦したのでメダルを1枚獲得！';$('result').classList.remove('hidden')}
function answer(v){if(!playing||locked)return;locked=true;if(v===deck[idx][1]){score++;toast('正解！')}else toast('ざんねん！');$('score').textContent=score;setTimeout(()=>{idx++;if(idx>=4)finish();else{locked=false;player.position.set(0,0,17);hud()}},950)}
let yOffset=0;function jump(){if(ground)jumpQueued=true}
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04),time=clock.elapsedTime;
if(playing&&!locked){let x=0,z=0;if(keys.w||keys.arrowup)z+=1;if(keys.s||keys.arrowdown)z-=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;x+=sx;z-=sy;let n=Math.hypot(x,z);if(n>1){x/=n;z/=n}const moving=n>.08,dx=Math.sin(yaw)*z+Math.cos(yaw)*x,dz=-Math.cos(yaw)*z+Math.sin(yaw)*x;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*7*dt,-34,34);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*7*dt,-36,36);if(moving){person.rotation.y=Math.atan2(dx,dz);let swing=Math.sin(time*10)*.55;arms[0].rotation.x=swing;arms[1].rotation.x=-swing;legs[0].rotation.x=-swing;legs[1].rotation.x=swing}else{[...arms,...legs].forEach(l=>l.rotation.x=THREE.MathUtils.lerp(l.rotation.x,0,.15))}
if(jumpQueued&&ground){vy=7.5;ground=false;jumpQueued=false}if(!ground){yOffset+=vy*dt;vy-=19*dt;if(yOffset<=0){yOffset=0;vy=0;ground=true}}player.position.y=yOffset;
for(const a of answerZones){if(Math.abs(player.position.x-a.x)<3.5&&Math.abs(player.position.z-a.z)<3.5){answer(a.value);break}}}
const target=new THREE.Vector3(player.position.x,player.position.y+1.65,player.position.z);const dist=8.7;camera.position.set(target.x+Math.sin(yaw)*dist,target.y+2.1+pitch*3,target.z+Math.cos(yaw)*dist);camera.lookAt(target.x,target.y+.15,target.z-1.4);renderer.render(scene,camera)}
animate();function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,180));
$('status').textContent='3Dワールド準備完了！スタートできます。';if(startRequested)startGame();
}catch(e){console.error(e);loadFailed=true;$('status').textContent='3Dエンジンの読み込みに失敗しました。インターネット接続を確認してください。'}
})();
</script>
